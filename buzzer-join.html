<!DOCTYPE html>
<!-- data-theme lives on <html>: custom properties inherit downward, so setting it
     on <body> leaves the root element on the default palette and its background
     shows through wherever content is shorter than the viewport. -->
<html lang="ar" dir="rtl" data-theme="sand">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>انضمام للبازر — خمّن صح</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<!-- Absolute, not relative: this page is also served from /j/CODE, where a
     relative "style.css" resolves to /j/style.css — which the /j/* rewrite
     happily answers with this very HTML file, and the stylesheet never loads. -->
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* No overflow:hidden here — on a short phone with the keyboard open the join
     form used to be clipped with no way to reach the button. */
  html,body{background:var(--bg);min-height:100%}
  .bz-page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .icn{width:1em;height:1em;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* ---- top bar ---- */
  .bz-topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;flex-shrink:0}
  .bz-leave{display:flex;align-items:center;gap:5px;background:var(--bg-card2);border:2px solid var(--border);border-radius:10px;padding:6px 12px;font-family:'AA Galaxy','Tajawal',sans-serif;font-size:0.8rem;font-weight:700;color:var(--text-mid);cursor:pointer;box-shadow:2px 2px 0px color-mix(in srgb, var(--border) 80%, #000)}
  .bz-leave:active{box-shadow:none;transform:translateY(2px)}
  .bz-leave .icn{width:16px;height:16px}
  .bz-room-chip{font-size:0.78rem;font-weight:800;color:var(--text-soft);background:var(--bg-card2);border:1.5px solid var(--border-light);border-radius:10px;padding:5px 12px;direction:ltr}
  .bz-room-chip.hidden, .bz-leave.hidden{visibility:hidden}

  /* ---- join form ---- */
  .bz-wrap{flex:1;max-width:420px;width:100%;margin:0 auto;padding:10px 20px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .bz-logo{font-family:'AA Galaxy','Lalezar',cursive;font-size:2.4rem;color:var(--accent);margin-bottom:4px}
  .bz-tagline{color:var(--text-soft);font-size:0.9rem;margin-bottom:22px}
  .bz-card{width:100%;background:color-mix(in srgb, var(--bg-card) 65%, transparent);backdrop-filter:blur(14px);border:1.5px solid var(--border-light);border-radius:20px;padding:26px 22px;box-shadow:var(--shadow)}
  .bz-field{text-align:right;margin-bottom:14px}
  .bz-field label{display:block;font-size:0.82rem;font-weight:700;color:var(--text-soft);margin-bottom:6px}
  .bz-card input{width:100%;padding:13px 16px;font-size:1.1rem;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-family:'AA Galaxy','Tajawal',sans-serif;text-align:center;transition:border-color .2s}
  .bz-card input:focus{outline:none;border-color:var(--gold)}
  .bz-card input#codeInput{direction:ltr;letter-spacing:6px;font-family:monospace;font-size:1.3rem}
  .bz-btn{width:100%;padding:14px;border:2px solid #b07820;border-radius:12px;background:#f0a830;color:#fff;font-family:'AA Galaxy','Tajawal',sans-serif;font-size:1.1rem;font-weight:800;cursor:pointer;box-shadow:4px 4px 0px #8a5e18;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
  .bz-btn:active{box-shadow:none;transform:translateY(4px)}
  .bz-btn[disabled]{opacity:.6;pointer-events:none}
  .bz-btn .icn{width:20px;height:20px}
  .bz-error{color:var(--danger);font-size:0.85rem;margin-top:10px;font-weight:700}

  /* ---- buzzer screen ---- */
  .buzz-screen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:10px 20px 30px;gap:clamp(10px,3vh,22px)}
  .buzz-team-card{display:flex;flex-direction:column;align-items:center;gap:6px}
  .buzz-team-name{font-family:'AA Galaxy','Lalezar',cursive;font-size:clamp(1.4rem,6vw,2rem);color:var(--text)}

  /* Connection pill — reflects the socket, not a hardcoded "connected" label.
     Colour and text are driven together so the two can never disagree. */
  .bz-conn{display:inline-flex;align-items:center;gap:7px;font-size:0.78rem;font-weight:700;border-radius:20px;padding:4px 13px;transition:background .25s,color .25s}
  .bz-conn::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;flex-shrink:0}
  .bz-conn[data-state="online"]{color:var(--green);background:color-mix(in srgb, var(--green) 14%, transparent)}
  .bz-conn[data-state="waiting"]{color:var(--gold-dark);background:color-mix(in srgb, var(--gold) 16%, transparent)}
  .bz-conn[data-state="waiting"]::before{animation:connPulse 1.1s ease-in-out infinite}
  .bz-conn[data-state="offline"]{color:var(--danger);background:var(--danger-bg)}
  @keyframes connPulse{0%,100%{opacity:1}50%{opacity:.25}}

  .buzz-button{
    width:clamp(150px,42vmin,240px);height:clamp(150px,42vmin,240px);border-radius:50%;border:6px solid #8a1f1f;
    background:radial-gradient(circle at 35% 30%, #ff6b6b, #c0392b);
    color:#fff;font-family:'AA Galaxy','Lalezar',cursive;font-size:clamp(1.2rem,6vmin,1.7rem);font-weight:900;
    box-shadow:0 10px 0 #7a1515, 0 14px 24px rgba(0,0,0,0.3);
    cursor:pointer;transition:transform .1s;flex-shrink:0;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .buzz-button:active{transform:translateY(8px);box-shadow:0 2px 0 #7a1515, 0 4px 10px rgba(0,0,0,0.3)}
  .buzz-button.locked{background:#9ca3af;border-color:#6b7280;box-shadow:0 10px 0 #4b5563;cursor:not-allowed;filter:grayscale(0.6)}
  .buzz-button.pulse{animation:buzzPulse 1s ease-in-out infinite}
  @keyframes buzzPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .buzz-status-card{width:100%;max-width:360px;text-align:center;background:color-mix(in srgb, var(--bg-card) 55%, transparent);backdrop-filter:blur(10px);border:1.5px solid var(--border-light);border-radius:16px;padding:14px 18px}
  .buzz-status{font-size:1rem;font-weight:700;color:var(--text-soft);min-height:26px}
  .buzz-status.win{color:var(--green);font-weight:900;font-size:1.25rem}
  .buzz-status.lose{color:var(--danger);font-weight:800}
  .buzz-hint{font-size:0.75rem;color:var(--text-soft);margin-top:4px;opacity:.8}

  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  @media(max-height:600px){
    .buzz-screen{gap:10px;padding:6px 20px 14px}
    .buzz-team-name{font-size:1.2rem}
  }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 4H6a1.2 1.2 0 0 0-1.2 1.2v13.6A1.2 1.2 0 0 0 6 20h4"/><path d="M20 12H9.5M16.5 8.5 20 12l-3.5 3.5"/></symbol>
  <symbol id="i-enter" viewBox="0 0 24 24"><path d="M14 4h4a1.2 1.2 0 0 1 1.2 1.2v13.6A1.2 1.2 0 0 1 18 20h-4"/><path d="M4 12h10.5M11 8.5 14.5 12 11 15.5"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></symbol>
</svg>

<div class="bz-page">
  <div class="bz-topbar">
    <button class="bz-leave hidden" id="leaveBtn" onclick="leaveRoom()">
      <svg class="icn"><use href="#i-exit"></use></svg>
      مغادرة
    </button>
    <div class="bz-room-chip hidden" id="roomChip">—</div>
  </div>

  <div class="bz-wrap" id="joinScreen">
    <div class="bz-logo">خمّن صح</div>
    <div class="bz-tagline">انضموا لغرفة البازر من جوالاتكم</div>
    <div class="bz-card">
      <div class="bz-field">
        <label>كود الغرفة</label>
        <input type="text" id="codeInput" placeholder="00000" maxlength="5" inputmode="numeric" autocomplete="off">
      </div>
      <div class="bz-field">
        <label>اسم فريقكم</label>
        <input type="text" id="nameInput" placeholder="مثلاً: النمور" maxlength="20" autocomplete="off">
      </div>
      <button class="bz-btn" id="joinBtn" onclick="joinRoom()">
        <svg class="icn"><use href="#i-enter"></use></svg>
        انضمام
      </button>
      <div class="bz-error" id="joinError" style="display:none"></div>
    </div>
  </div>

  <div class="buzz-screen" id="buzzScreen">
    <div class="buzz-team-card">
      <div class="bz-conn" id="connPill" data-state="waiting">جاري الاتصال</div>
      <div class="buzz-team-name" id="teamNameDisplay"></div>
    </div>
    <button class="buzz-button locked" id="buzzBtn" onclick="pressBuzz()">اضغط!</button>
    <div class="buzz-status-card">
      <div class="buzz-status" id="buzzStatus">بانتظار المضيف يفتح الأزرار...</div>
      <div class="buzz-hint">خلّوا الجوال بإيدكم جاهز — بيفتح تلقائي أول ما يبدأ السؤال</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://jydohcccucwwnxgbdyqu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5ZG9oY2NjdWN3d254Z2JkeXF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNDU4MTEsImV4cCI6MjA4OTkyMTgxMX0.hgrBBF4wRtQEWGpwngOm5lN5A_fqIRisLXQxwEzLyDQ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let channel = null;
let teamName = '';
let roomCode = '';
let unlocked = false;
let hasBuzzedThisRound = false;
let inRoom = false;
let rejoinTimer = null;
let rejoinDelay = 1000;

/* ========== theme ========== */
// Falls back to the phone's own light/dark preference until the host tells us
// which theme it is using — better than being pinned to one palette at night.
const THEME_IDS = ['sand','ocean','forest','sunset','navy'];
function applyTheme(t){
  if(THEME_IDS.indexOf(t) === -1) return;
  document.documentElement.setAttribute('data-theme', t);
}
applyTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'navy' : 'sand');

/* ========== feedback ========== */
// Vibration is the confirmation that matters on a phone: the player is looking
// at the host's screen, not their own, when they slam the button.
function haptic(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern) }catch(e){}
}

// Tones are synthesised rather than loaded so the page stays a single file and
// works instantly on a phone that just opened it.
let actx = null;
function tone(freq, dur, type, vol){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(vol || 0.14, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
const SFX = {
  unlock: ()=>{ tone(660,.12,'square',.10); setTimeout(()=>tone(880,.16,'square',.10),90) },
  press:  ()=>  tone(520,.09,'square',.12),
  win:    ()=>{ tone(660,.12,'triangle',.15); setTimeout(()=>tone(880,.12,'triangle',.15),110); setTimeout(()=>tone(1180,.26,'triangle',.15),220) },
  lose:   ()=>{ tone(320,.18,'sine',.10); setTimeout(()=>tone(240,.24,'sine',.10),140) },
};

/* ========== keep the screen awake ========== */
// Players hold the phone waiting for the host to unlock. Without this the screen
// dims and locks, and they miss the press.
let wakeLock = null;
async function keepAwake(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null });
    }
  }catch(e){ /* denied or unsupported — nothing else to do */ }
}
function releaseAwake(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock = null } }catch(e){}
}
// The browser drops the lock whenever the tab is hidden, so re-take it on return.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && inRoom) keepAwake();
});

/* ========== connection state ========== */
function setConn(state, label){
  const pill = $('connPill');
  pill.dataset.state = state;
  pill.textContent = label;
}

function scheduleRejoin(){
  if(!inRoom || rejoinTimer) return;
  setConn('waiting', 'جاري إعادة الاتصال');
  rejoinTimer = setTimeout(()=>{
    rejoinTimer = null;
    if(!inRoom) return;
    openChannel(roomCode);
    rejoinDelay = Math.min(rejoinDelay * 2, 15000);   // back off, don't hammer
  }, rejoinDelay);
}

window.addEventListener('online',  ()=>{ if(inRoom){ rejoinDelay = 1000; scheduleRejoin() } });
window.addEventListener('offline', ()=>{ if(inRoom) setConn('offline', 'لا يوجد إنترنت') });

/* ========== join ========== */
const params = new URLSearchParams(location.search);
const fromPath = (location.pathname.match(/\/j\/([A-Za-z0-9]+)/i) || [])[1];
const joinCode = params.get('code') || fromPath;
if (joinCode) $('codeInput').value = joinCode.toUpperCase();

// Rejoining after a refresh or a leave shouldn't mean retyping the team name.
try{
  const saved = localStorage.getItem('khamen_team_name');
  if(saved) $('nameInput').value = saved;
}catch(e){}

// Land the cursor on whichever field is still empty.
if($('codeInput').value && !$('nameInput').value) $('nameInput').focus();

[$('codeInput'), $('nameInput')].forEach(el=>{
  el.addEventListener('keydown', e=>{ if(e.key === 'Enter') joinRoom() });
});

function joinRoom(){
  const code = $('codeInput').value.trim();
  const name = $('nameInput').value.trim();
  const errEl = $('joinError');
  if (!/^\d{5}$/.test(code)) { errEl.textContent = 'أدخل كود الغرفة المكوّن من 5 أرقام'; errEl.style.display='block'; return; }
  if (!name) { errEl.textContent = 'أدخل اسم فريقكم'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';

  teamName = name;
  roomCode = code;
  inRoom = true;
  rejoinDelay = 1000;
  hasBuzzedThisRound = false;
  unlocked = false;

  try{ localStorage.setItem('khamen_team_name', name) }catch(e){}

  // This click is the user gesture that lets audio start on mobile.
  tone(0.01, 0.01, 'sine', 0.0001);

  $('joinBtn').setAttribute('disabled','');
  $('joinScreen').style.display = 'none';
  $('buzzScreen').style.display = 'flex';
  $('teamNameDisplay').textContent = teamName;
  $('roomChip').textContent = code;
  $('roomChip').classList.remove('hidden');
  $('leaveBtn').classList.remove('hidden');
  setConn('waiting', 'جاري الاتصال');
  keepAwake();

  openChannel(code);
}

function openChannel(code){
  if(channel){ try{ sb.removeChannel(channel) }catch(e){} channel = null; }

  channel = sb.channel('room-' + code, {
    config: { presence: { key: 'team-' + Math.random().toString(36).slice(2,8) } }
  });

  channel.on('broadcast', { event: 'theme' }, (p)=>{
    if(p.payload && p.payload.theme) applyTheme(p.payload.theme);
  });

  channel.on('broadcast', { event: 'unlock' }, () => {
    unlocked = true;
    hasBuzzedThisRound = false;
    const btn = $('buzzBtn');
    btn.classList.remove('locked'); btn.classList.add('pulse');
    $('buzzStatus').className = 'buzz-status';
    $('buzzStatus').textContent = 'الحين! اضغط بسرعة!';
    haptic([30,40,30]); SFX.unlock();
  });

  channel.on('broadcast', { event: 'lock' }, () => {
    unlocked = false;
    const btn = $('buzzBtn');
    btn.classList.add('locked'); btn.classList.remove('pulse');
    $('buzzStatus').className = 'buzz-status';
    $('buzzStatus').textContent = 'بانتظار السؤال الجاي...';
  });

  channel.on('broadcast', { event: 'winner' }, (payload) => {
    unlocked = false;
    const btn = $('buzzBtn');
    btn.classList.add('locked'); btn.classList.remove('pulse');
    const winnerName = payload.payload.team_name;
    const statusEl = $('buzzStatus');
    if (winnerName === teamName) {
      statusEl.className = 'buzz-status win';
      statusEl.textContent = 'سبقتوا! ردّوا على السؤال';
      haptic([60,50,120]); SFX.win();
    } else {
      statusEl.className = 'buzz-status lose';
      statusEl.textContent = winnerName + ' سبقوكم';
      haptic(25); SFX.lose();
    }
  });

  channel.subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      rejoinDelay = 1000;
      channel.track({ team_name: teamName });
      setConn('online', 'متصلين بالغرفة');
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
      // Previously these were ignored, so a dropped socket left the player
      // staring at a dead button under a green "connected" dot.
      scheduleRejoin();
    } else if (status === 'CLOSED' && inRoom) {
      scheduleRejoin();
    }
  });
}

function pressBuzz(){
  if (!unlocked || hasBuzzedThisRound) return;
  hasBuzzedThisRound = true;
  haptic(40); SFX.press();
  $('buzzBtn').classList.add('locked');
  $('buzzBtn').classList.remove('pulse');
  $('buzzStatus').textContent = 'تم الإرسال...';
  try{
    channel.send({ type: 'broadcast', event: 'buzz', payload: { team_name: teamName } });
  }catch(e){
    $('buzzStatus').textContent = 'تعذّر الإرسال — تحقق من الاتصال';
  }
}

function leaveRoom(){
  inRoom = false;
  if(rejoinTimer){ clearTimeout(rejoinTimer); rejoinTimer = null }
  if (channel) { try{ sb.removeChannel(channel) }catch(e){} channel = null; }
  releaseAwake();
  unlocked = false;
  hasBuzzedThisRound = false;
  $('buzzBtn').classList.add('locked');
  $('buzzBtn').classList.remove('pulse');
  $('leaveBtn').classList.add('hidden');
  $('roomChip').classList.add('hidden');
  $('buzzScreen').style.display = 'none';
  $('joinScreen').style.display = 'flex';
  $('joinBtn').removeAttribute('disabled');
  $('buzzStatus').className = 'buzz-status';
  $('buzzStatus').textContent = 'بانتظار المضيف يفتح الأزرار...';
  $('codeInput').value = '';
  $('codeInput').focus();
}
</script>
</body>
</html>
